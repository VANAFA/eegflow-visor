<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>EEGFlow</title>
<link rel="icon" href="app/eegflow/assets/icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.3/build/stlite.css">
</head>
<body>
<div id="root"></div>
<noscript>EEGFlow necesita JavaScript: la web corre en el navegador con stlite.</noscript>
<script type="module">
import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.3/build/stlite.js";
mount({
 "requirements": [
  "httpx",
  "pandas"
 ],
 "entrypoint": "eegflow/web.py",
 "files": {
  "eegflow/__init__.py": {
   "url": "app/eegflow/__init__.py"
  },
  "eegflow/assets/icon.svg": {
   "url": "app/eegflow/assets/icon.svg"
  },
  "eegflow/assets/logo.svg": {
   "url": "app/eegflow/assets/logo.svg"
  },
  "eegflow/demo_api.py": {
   "url": "app/eegflow/demo_api.py"
  },
  "eegflow/paginas/modelos.py": {
   "url": "app/eegflow/paginas/modelos.py"
  },
  "eegflow/paginas/registros.py": {
   "url": "app/eegflow/paginas/registros.py"
  },
  "eegflow/paginas/trabajos.py": {
   "url": "app/eegflow/paginas/trabajos.py"
  },
  "eegflow/paginas/visor.py": {
   "url": "app/eegflow/paginas/visor.py"
  },
  "eegflow/web.py": {
   "url": "app/eegflow/web.py"
  },
  "eegflow/web_api.py": {
   "url": "app/eegflow/web_api.py"
  },
  "eegflow/web_catalog.py": {
   "url": "app/eegflow/web_catalog.py"
  },
  "eegflow/web_ml.py": {
   "url": "app/eegflow/web_ml.py"
  },
  "eegflow/web_runs.py": {
   "url": "app/eegflow/web_runs.py"
  },
  "eegflow/web_signal.py": {
   "url": "app/eegflow/web_signal.py"
  },
  "eegflow/webview.py": {
   "url": "app/eegflow/webview.py"
  },
  "eegflow/snapshot.json": {
   "url": "app/snapshot.json"
  }
 },
 "streamlitConfig": {
  "client.toolbarMode": "viewer",
  "theme.baseRadius": "0.5rem",
  "theme.showWidgetBorder": true,
  "theme.light.primaryColor": "#2a78d6",
  "theme.light.linkColor": "#2a78d6",
  "theme.dark.primaryColor": "#4c93e6",
  "theme.dark.linkColor": "#6aa8ee"
 }
}, document.getElementById("root"));
</script>
</body>
</html>
